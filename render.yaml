services:
  - type: web
    name: labelsense-backend
    runtime: python3
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: labelsense-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://labelsense.onrender.com
      - key: APP_NAME
        value: LabelSense

  - type: pserv
    name: labelsense-db
    runtime: postgresql
    version: 15
    databaseName: labelsense_db
    user: labelsense_user