services:
  - type: web
    name: labelsense-backend
    runtime: python3
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: labelsense-db
          property: connectionString
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173,https://your-vercel-domain.vercel.app
      - key: APP_NAME
        value: LabelSense
      - key: PYTHON_VERSION
        value: 3.11.7

  - type: pserv
    name: labelsense-db
    runtime: postgresql
    version: 15
    databaseName: labelsense_db
    user: labelsense_user